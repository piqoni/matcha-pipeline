name: Update RSS Feed
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Matcha
        run: go install github.com/piqoni/matcha@latest

      - name: Run Matcha with Custom Config
        run: |
          mkdir -p output 
          matcha -c config.yaml

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Update RSS feeds and DB state"
          file_pattern: 'feeds/*.md matcha.db' 
          branch: main