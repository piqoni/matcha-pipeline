name: Update RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create config.yaml from secret
        run: |
          cat << 'EOF' > config.yaml
          ${{ vars.MATCHA_CONFIG_YAML }}
          EOF

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Matcha
        run: go install github.com/piqoni/matcha@generate_all

      - name: Decrypt database
        run: |
          if [ -f matcha.db.enc ]; then
            openssl enc -aes-256-cbc -pbkdf2 \
              -d -in matcha.db.enc \
              -out matcha.db \
              -pass pass:"${{ secrets.MATCHA_DB_KEY }}"
          fi

      - name: Run Matcha with Custom Config
        run: |
          matcha -c config.yaml
          matcha -c config.yaml --generate-all

      - name: Build HTML content
        run: |
          go run build_content.go

      - name: Remove plaintext markdown
        run: rm -f pre-docs/*.md

      - name: Encrypt database
        run: |
          openssl enc -aes-256-cbc -pbkdf2 \
            -salt \
            -in matcha.db \
            -out matcha.db.enc \
            -pass pass:"${{ secrets.MATCHA_DB_KEY }}"
          rm -f matcha.db

      - name: Encrypt site with Staticrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          npm install -g staticrypt
          staticrypt pre-docs/index.html \
            -p "$STATICRYPT_PASSWORD" \
            -d docs

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Update RSS feeds and DB state"
          file_pattern: 'matcha.db.enc docs/*'
          branch: main
