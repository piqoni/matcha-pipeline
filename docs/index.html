<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Digest</title>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      height: 100vh;
    }

    #sidebar {
      width: 260px;
      border-right: 1px solid #ddd;
      padding: 1rem;
      overflow-y: auto;
      background: #fafafa;
    }

    #content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    .date {
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }

    .date:hover {
      background: #eee;
    }

    .date.active {
      background: #ddd;
      font-weight: 600;
    }

    pre {
      background: #f6f8fa;
      padding: 1rem;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>Daily Digests</h3>
    <div id="dates"></div>
  </div>

  <div id="content">
    <em>Select a date</em>
  </div>

<script src="content.js"></script>
<script>
  const datesEl = document.getElementById("dates");
  const contentEl = document.getElementById("content");

  const dates = Object.keys(window.DIGESTS).sort().reverse();

  for (const date of dates) {
    const div = document.createElement("div");
    div.textContent = date;
    div.className = "date";
    div.onclick = () => {
      document.querySelectorAll(".date").forEach(d => d.classList.remove("active"));
      div.classList.add("active");
      contentEl.innerHTML = window.DIGESTS[date];
    };
    datesEl.appendChild(div);
  }

  if (dates.length > 0) {
    datesEl.firstChild.click();
  }
</script>


</body>
</html>
